# Agenda en tijdlijn van het project.
#
# Nieuwe afspraak toevoegen? Kopieer een blok en pas het aan.
# De volgorde maakt niet uit: de site sorteert op datum en zet
# komende afspraken automatisch bovenaan. De weekdag wordt ook
# automatisch berekend, die hoef je dus niet te typen.
#
#   datum:    JJJJ-MM-DD (verplicht)
#   tijd:     bijv. "17:00" (optioneel)
#   titel:    korte omschrijving (verplicht)
#   plaats:   waar (optioneel)
#   tekst:    extra uitleg (optioneel)
#   foto:     pad naar een afbeelding in img/ (optioneel)
#   foto_alt: korte beschrijving van de foto (bij een foto)

