<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="{{ site.author }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{{ '/img/background.jpg' | absolute_url }}">
    <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <nav class="nav">
      <a class="nav-brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/img/logo.jpg' | relative_url }}" alt="">
        <span>Bloemenparadijs</span>
      </a>
      <ul>
        <li><a href="{{ '/#plan' | relative_url }}">Plan</a></li>
        <li><a href="{{ '/#uitvoering' | relative_url }}">Uitvoering</a></li>
        <li><a href="{{ '/#planning' | relative_url }}">Planning</a></li>
        <li><a href="{{ '/#andere_projecten' | relative_url }}">Buurt</a></li>
        <li><a href="{{ '/#contact' | relative_url }}">Contact</a></li>
      </ul>
    </nav>

    {{ content }}

    <footer class="footer">
      <div class="tulips" aria-hidden="true"></div>
      <p>
        Initiatief van bewoners van de van Dortstraat, mogelijk gemaakt door de gemeente Haarlem via
        <a href="https://noordaanzet.nl/zuid-noord/">Noord aan Zet</a>.
      </p>
    </footer>

    <script src="{{ '/assets/main.js' | relative_url }}"></script>
  </body>
</html>
